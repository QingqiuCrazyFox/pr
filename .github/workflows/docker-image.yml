name: Build APK (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # ---- 修复子模块 URL（关键修复） ----
      - name: Fix submodule URLs
        run: |
          # 1. Bionic：aosp-mirror 使用下划线
          sed -i 's|https://android.googlesource.com/platform/bionic|https://github.com/aosp-mirror/platform_bionic|g' .gitmodules

          # 2. Busybox：官方 Git 域名是 git.busybox.net
          sed -i 's|git://busybox.net|http://git.busybox.net|g' .gitmodules

          # 3. Musl：官方 Git 域名是 git.musl-libc.org
          sed -i 's|git://git.musl-libc.org|http://git.musl-libc.org|g' .gitmodules

          # 4. Samba：支持 https
          sed -i 's|git://git.samba.org|https://git.samba.org|g' .gitmodules

          # 5. GitHub SSH → HTTPS
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules

          cat .gitmodules   # 打印检查

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init --recursive --depth=1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true

      - name: Install Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          ndk-version: '27.0.12077973'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Build proot
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh --arch=arm64

      - name: Build integration test (optional)
        run: |
          cd src/proot-integration-test
          cargo build --target aarch64-linux-android --release

      - name: Build pr-cli
        run: |
          cd src/pr-cli
          cargo build --target aarch64-linux-android --release

      - name: Copy binaries to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build/out/arm64/proot android/app/src/main/jniLibs/arm64-v8a/libproot.so
          cp build/out/arm64/loader android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          cp src/pr-cli/target/aarch64-linux-android/release/pr-cli \
             android/app/src/main/jniLibs/arm64-v8a/libpr-cli.so

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oonid-pr-debug
          path: android/app/build/outputs/apk/debug/*.apk
