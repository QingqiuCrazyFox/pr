name: Build APK (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # ---- 手动克隆所有依赖（禁用交互式认证） ----
      - name: Clone all dependencies
        env:
          GIT_TERMINAL_PROMPT: 0
          GIT_ASKPASS: echo
        run: |
          mkdir -p vendor

          # 1. bionic
          git clone https://github.com/aosp-mirror/platform_bionic vendor/bionic
          cd vendor/bionic
          git checkout 731631f
          cd ../..

          # 2. busybox (官方 HTTP，带重试)
          git clone http://git.busybox.net/busybox vendor/busybox || \
            (sleep 5 && git clone http://git.busybox.net/busybox vendor/busybox)
          cd vendor/busybox
          git checkout 2f3b16fc1b46b4b91dabb59025dffa02b2730624
          cd ../..

          # 3. musl (GitHub HTTPS，禁用交互)
          git clone https://github.com/musl/musl vendor/musl
          cd vendor/musl
          git checkout 5122f9f3c99fee366167c5de98b31546312921ab
          cd ../..

          # 4. proot + 内部 uthash
          git clone https://github.com/proot-me/proot vendor/proot
          cd vendor/proot
          git checkout 5f780cba57ce7ce557a389e1572e0d30026fcbca
          mkdir -p lib/uthash
          git clone https://github.com/proot-me/uthash lib/uthash
          cd lib/uthash
          git checkout e493aa90a2833b4655927598f169c31cfcdf7861
          cd ../../..

          # 5. samba
          git clone https://github.com/samba-team/samba vendor/samba
          cd vendor/samba
          git checkout 2f8dfde1210395175e726455bdb63a7b97245a72
          cd ../..

          # 6. termlib (最新 master)
          git clone --depth=1 https://github.com/connectbot/termlib vendor/termlib

          # 7. termux-proot
          git clone https://github.com/termux/proot vendor/termux-proot
          cd vendor/termux-proot
          git checkout ab2e34614e1bc6ac83c8d9f3edbfaec869ce8b22
          cd ../..

          # 8. termux-proot-distro
          git clone https://github.com/termux/proot-distro vendor/termux-proot-distro
          cd vendor/termux-proot-distro
          git checkout 98b6d7181cfb15094598b5a7254d13c3e6b901db
          cd ../..

          ls -la vendor/

      # ---- 设置构建环境 ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true

      - name: Install Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          ndk-version: '27.0.12077973'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      # ---- 构建步骤 ----
      - name: Build proot
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh --arch=arm64

      - name: Build integration test
        run: |
          cd src/proot-integration-test
          cargo build --target aarch64-linux-android --release

      - name: Build pr-cli
        run: |
          cd src/pr-cli
          cargo build --target aarch64-linux-android --release

      - name: Copy binaries to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build/out/arm64/proot android/app/src/main/jniLibs/arm64-v8a/libproot.so
          cp build/out/arm64/loader android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          cp src/pr-cli/target/aarch64-linux-android/release/pr-cli \
             android/app/src/main/jniLibs/arm64-v8a/libpr-cli.so

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oonid-pr-debug
          path: android/app/build/outputs/apk/debug/*.apk
