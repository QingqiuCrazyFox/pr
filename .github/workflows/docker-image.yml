name: Build APK (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 手动触发

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码（暂不拉取子模块）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      # 2. 精准修复子模块 URL（解决 404）
      - name: Fix submodule URLs
        run: |
          sed -i 's|https://android.googlesource.com/platform/bionic|https://github.com/aosp-mirror/platform_bionic|g' .gitmodules
          sed -i 's|git://busybox.net|http://busybox.net|g' .gitmodules
          sed -i 's|git://git.musl-libc.org|http://git.musl-libc.org|g' .gitmodules
          sed -i 's|git://git.samba.org|https://git.samba.org|g' .gitmodules
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          cat .gitmodules

      # 3. 初始化子模块（浅克隆加速）
      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init --recursive --depth=1

      # 4. 设置 Java 17（Gradle 需要）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. 设置 Rust
      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-linux-android
          override: true

      # 6. 安装 Android SDK 和 NDK
      - name: Install Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'
          ndk-version: '27.0.12077973'

      # 7. 安装系统依赖（cmake, ninja）
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      # 8. 构建 proot（arm64）
      - name: Build proot
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh --arch=arm64

      # 9. 构建 test binary（如果你不需要可注释掉）
      - name: Build integration test
        run: |
          cd src/proot-integration-test
          cargo build --target aarch64-linux-android --release

      # 10. 构建 pr-cli
      - name: Build pr-cli
        run: |
          cd src/pr-cli
          cargo build --target aarch64-linux-android --release

      # 11. 复制二进制文件到 Android jniLibs
      - name: Copy binaries to jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build/out/arm64/proot android/app/src/main/jniLibs/arm64-v8a/libproot.so
          cp build/out/arm64/loader android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          cp src/pr-cli/target/aarch64-linux-android/release/pr-cli \
             android/app/src/main/jniLibs/arm64-v8a/libpr-cli.so

      # 12. 构建 Debug APK
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 13. 上传 APK 作为构建产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oonid-pr-debug
          path: android/app/build/outputs/apk/debug/*.apk
