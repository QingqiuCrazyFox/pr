name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ---------- 代码检出（含子模块处理） ----------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false          # 先不自动拉取
          fetch-depth: 0

      - name: Prepare submodule URLs and clone
        run: |
          # 将 SSH 协议改为 HTTPS（处理 github.com 子模块）
          sed -i 's|git@github.com:|https://github.com/|g' .gitmodules
          git submodule sync --recursive
          # 全局将 git:// 协议替换为 http://（解决 busybox 连接问题）
          git config --global url."http://".insteadOf git://
          # 初始化并拉取所有子模块（递归，depth=1 加速）
          git submodule update --init --recursive --depth=1

      # ---------- 安装系统依赖 ----------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            file \
            git \
            make \
            ninja-build \
            python3 \
            wget \
            unzip

      # ---------- 设置 Android NDK (r27c) ----------
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
          local-cache: true

      # ---------- 设置 Rust ----------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      # ---------- 1. 构建 Proot (arm64) ----------
      - name: Build proot
        run: scripts/build.sh --arch=arm64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # ---------- 2. 构建 test binary (Rust) ----------
      - name: Build test binary
        run: |
          cd src/proot-integration-test
          cargo build --target aarch64-linux-android --release

      # ---------- 3. 构建 pr-cli (Rust) ----------
      - name: Build pr-cli
        run: |
          cd src/pr-cli
          cargo build --target aarch64-linux-android --release

      # ---------- 4. 复制二进制到 Android 项目 ----------
      - name: Copy binaries to Android JNI libs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp build/out/arm64/proot   android/app/src/main/jniLibs/arm64-v8a/libproot.so
          cp build/out/arm64/loader  android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          cp src/pr-cli/target/aarch64-linux-android/release/pr-cli \
             android/app/src/main/jniLibs/arm64-v8a/libpr-cli.so

      # ---------- 5. 构建 APK ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # ---------- 上传 APK ----------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
